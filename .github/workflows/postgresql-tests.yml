name: PostgreSQL backend tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d integration"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ci:disposable-ci-password@127.0.0.1:5432/integration
      STEP9C_TEST_DATABASE_URL: postgresql+psycopg://ci:disposable-ci-password@127.0.0.1:5432/integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend test dependencies
        run: |
          python -m pip install fastapi==0.115.0 'starlette>=0.37.2,<0.39.0' 'pydantic>=2,<3' httpx pytest 'sqlalchemy>=2,<3' 'psycopg[binary]>=3.1,<4' 'alembic>=1.13,<2' python-dotenv joblib numpy pandas
      - name: Apply and verify migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Run PostgreSQL integration tests with synthetic predictions
        run: python -m pytest -q backend/tests/test_incidents.py backend/tests/test_prediction_alerts.py
